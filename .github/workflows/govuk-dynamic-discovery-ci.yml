name: Dialektik GOVUK dynamic discovery read-only proof
on:
  push:
    branches: [codex/govuk-dynamic-discovery-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prewrite-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Pinned build
        run: |
          npm install --global npm@11.6.2
          npm ci --no-audit --no-fund
          npm run build
      - name: Offline rights, robots, source identity and dedupe tests
        run: |
          node --test .github/scripts/govuk-search-discovery.test.mjs
          npx vitest run --config services/core-api/vitest.config.mts services/core-api/test/rights-gated-metadata-stage.test.ts
      - name: Real GOVUK search + content proof (read only, fail closed)
        env:
          DIALEKTIK_DISCOVERY_OUTPUT: ${{ runner.temp }}/dialektik-discovery/receipt.json
        run: node .github/scripts/govuk-search-discovery.mjs
      - name: Preserve only minimal metadata for 3 days
        uses: actions/upload-artifact@v4
        with:
          name: govuk-dynamic-readonly-receipt
          path: ${{ runner.temp }}/dialektik-discovery/receipt.json
          retention-days: 3
          if-no-files-found: error
