name: Science mode and story comments
on:
  pull_request:
    paths:
      - 'services/core-api/**'
      - 'packages/database/**'
      - 'package*.json'
      - '.github/workflows/core-science-comments-ci.yml'
      - '.github/workflows/science-harvest.yml'
permissions:
  contents: read
jobs:
  core-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # A real server: row security must be checked outside PGlite, on a
      # separate login without superuser or BYPASSRLS.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCIENCE_TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test services/core-api/test/science-comments.integration.test.mjs services/core-api/test/science-flag.test.mjs
      - run: node --test services/core-api/test/science-harvest.test.mjs services/core-api/test/science-lookup.test.mjs services/core-api/test/poll-measurement.test.mjs services/core-api/test/live-sightings.test.mjs services/core-api/test/story-grouping.test.mjs
      - run: node --test --test-concurrency=1 services/core-api/test/science-comments.postgres.test.mjs services/core-api/test/science-harvest.postgres.test.mjs services/core-api/test/poll-duel-rule.postgres.test.mjs services/core-api/test/live-sightings.postgres.test.mjs services/core-api/test/story-groups.postgres.test.mjs
      # Live: the four sources answer and parse (no database, no secrets).
      - run: node services/core-api/dist/science/harvest/harvest.cli.js --dry-run
        env:
          SCIENCE_HARVEST_LIMIT: '20'
          SCIENCE_HARVEST_DAYS: '14'
