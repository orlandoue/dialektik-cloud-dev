name: ATTACK 5 typed Chile geography (synthetic only)
on:
  push:
    branches: [codex/attack5-typed-georesolver-20261020]
    paths:
      - experiments/real-metadata-grouping/attack5.py
      - experiments/real-metadata-grouping/attack5/chile_geography.json
      - experiments/real-metadata-grouping/test_attack5.py
      - .github/workflows/attack5-typed-geography.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Sparse checkout only candidate and open geographic data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            experiments/real-metadata-grouping/attack5.py
            experiments/real-metadata-grouping/attack5/chile_geography.json
            experiments/real-metadata-grouping/test_attack5.py
          sparse-checkout-cone-mode: false
      - name: Assert no previous corpora, scorer, Gold or secret
        run: |
          test ! -e experiments/real-metadata-grouping/attack4-prospective/corpus.json
          test ! -e experiments/real-metadata-grouping/attack3b/corpus.json
          test ! -e experiments/real-metadata-grouping/score_attack3.py
          echo 'ISOLATED_SYNTHETIC_TESTS=TRUE'
      - name: Validate geography and adversarial typed event identities
        working-directory: experiments/real-metadata-grouping
        run: python3 -m unittest -v test_attack5.py
      - name: Declare no science or production authority
        run: |
          echo 'SCIENTIFIC_GOLD_SCORING=NOT_EXECUTED'
          echo 'R14_V10_11=NOT_USED'
          echo 'PERSISTENT_WRITES=0'
          echo 'PRODUCTION_PERMISSION=FALSE'
