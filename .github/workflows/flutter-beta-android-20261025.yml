name: Dialektik Android  private beta 25 October 2026

on:
  workflow_dispatch:
  push:
    branches:
      - codex/flutter-beta-android-20261025
  pull_request:
    branches:
      - codex/flutter-beta-android-20261025

permissions:
  contents: read

jobs:
  core-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify deployed Core health and private beta guard
        shell: bash
        run: |
          set -euo pipefail
          base='https://dialektik-core-dev.onrender.com'
          healthy=0
          for attempt in $(seq 1 12); do
            live=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$base/health/live" || true)
            ready=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$base/health/ready" || true)
            echo "Core attempt $attempt: live=$live ready=$ready"
            if [[ "$live" == '200' && "$ready" == '200' ]]; then
              healthy=1
              break
            fi
            sleep 12
          done
          if [[ "$healthy" != 1 ]]; then
            echo 'Backend unavailable. Fail closed without APK.'
            exit 1
          fi
          status=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$base/v1/feed?limit=1" || true)
          if [[ "$status" != '401' && "$status" != '403' ]]; then
            echo "Unexpected unauthenticated feed status HTTP $status"
            exit 1
          fi
          echo 'Core live/ready OK and private beta authorization enforced'
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validate Flutter formatting
        run: dart format --output=none lib/features/live/data/govuk_preview.dart lib/features/consumer/data/public_api_client.dart lib/app/dialektik_app.dart lib/features/live/presentation/live_news_screens.dart test/live/govuk_preview_test.dart
      - name: Analyze Dart and assert beta provenance
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --test-randomize-ordering-seed=0 --concurrency=1 test/app test/consumer test/design_system test/live test/private_beta
          dart run tool/check_design_invariants.dart
  apk-debug:
    needs: [core-smoke, dart]
    if: ${{ vars.DIALEKTIK_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      DIALEKTIK_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DIALEKTIK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build authorized private-beta debug Android
        shell: bash
        run: |
          set -euo pipefail
          case "$DIALEKTIK_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac
          flutter build apk --debug --no-pub \
            --dart-define=DIALEKTIK_ENVIRONMENT=production \
            --dart-define=DIALEKTIK_API_BASE_URL=https://dialektik-core-dev.onrender.com \
            --dart-define=DIALEKTIK_SUPABASE_URL=https://vclsswwfhljczxgnsciq.supabase.co \
            --dart-define="DIALEKTIK_SUPABASE_PUBLISHABLE_KEY=$DIALEKTIK_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=DIALEKTIK_NEWS_READER_ENABLED=true \
            --dart-define=DIALEKTIK_GOVUK_PREVIEW_ENABLED=true \
            --dart-define=DIALEKTIK_GOVUK_HOUSING_PREVIEW_ENABLED=true \
            --dart-define=DIALEKTIK_CHILE_EVENT_PREVIEW_ENABLED=true \
            --dart-define=DIALEKTIK_SEMANTIC_MODE=disabled \
            --dart-define=DIALEKTIK_OWNERSHIP_MODE=corporate
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
          {
            printf 'Dialektik Android private beta: 0.1.6+7\n'
            printf 'Flutter commit: %s\n' "$GITHUB_SHA"
            printf 'Core URL: https://dialektik-core-dev.onrender.com\n'
            printf 'Core source feature: official Chile publisher RSS headline-link pilot + USGS, semantic news engine still gated\n'
            printf 'Profile: debug APK; private beta; semantic mode disabled\n'
          } > build/build-info.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Dialektik-Android-2026-10-27-merged-Chile-RSS-beta
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/build-info.txt
          retention-days: 14
          if-no-files-found: error
