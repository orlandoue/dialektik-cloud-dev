name: Storage migration ledger full row equality (synthetic only)
on:
  push:
    branches: [codex/storage-seeded-ledger-exact-equality-20261021, codex/storage-ledger-classify-without-data-20261021, codex/storage-timestamp-only-schema-identity-20261021]
permissions:
  contents: read
jobs:
  full-row-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse and test exact comparison refusal matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/operations/storage_seeded_ledger_gate.py
          bash -n scripts/operations/replay_synchronized_data_offline.sh
          python3 -m unittest discover -s scripts/operations -p test_storage_seeded_ledger_gate.py -v
          echo 'STORAGE_FULL_ROW_MATCH_AND_DIFF_REJECTION=PASS'
          echo 'REAL_SNAPSHOT_DECRYPTED=FALSE'
          echo 'DEV_DATABASE_MUTATION=0'
