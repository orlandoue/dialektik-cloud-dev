name: Live private-beta API acceptance without credentials
on:
  push:
    branches: [codex/beta-launch-readiness-20261022]
permissions:
  contents: read
jobs:
  render-beta-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate production API health and protected access
        env:
          DIALEKTIK_BETA_SMOKE_ONLY: YES
        run: |
          set -euo pipefail
          node --check .github/scripts/beta-launch-readonly-smoke.mjs
          node .github/scripts/beta-launch-readonly-smoke.mjs
