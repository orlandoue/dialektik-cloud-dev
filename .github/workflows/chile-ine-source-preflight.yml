name: Chile INE rights and robots technical preflight ONLY
on:
  push:
    branches: [codex/chile-ine-robots-rights-preflight-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ine-robots-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test fail-closed INE robots boundary without fetching articles
        run: node --test .github/scripts/chile-ine-robots-preflight.test.mjs
      - name: Check public INE robots once and nothing else
        run: node .github/scripts/chile-ine-robots-preflight.mjs
