name: Core contradiction evidence gate
on:
  push:
    branches: [codex/core-contradiction-evidence-gate-20261026]
  pull_request:
    paths:
      - 'services/core-api/**'
      - '.github/workflows/core-contradiction-evidence-ci.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test services/core-api/test/public-contradiction-evidence-gate.test.mjs
