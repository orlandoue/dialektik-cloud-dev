name: Dialektik secure recovery CI

on:
  push:
    branches:
      - codex/secure-password-recovery-20261019
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dialektik-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-build-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin npm to repository package manager
        run: npm install --global npm@11.6.2
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Build Database and Core
        run: npm run build
      - name: Test password recovery
        run: npx vitest run --config services/core-api/vitest.config.mts services/core-api/test/password-recovery.test.ts
