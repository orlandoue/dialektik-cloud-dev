name: Core read-only review directory
on:
  push:
    branches: [codex/live-registered-sources-review-20261026]
  pull_request:
    paths:
      - 'services/core-api/**'
      - '.github/workflows/core-registered-sources-review-ci.yml'
permissions:
  contents: read
jobs:
  directory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test services/core-api/test/live-registered-sources-review.test.mjs services/core-api/test/live-source-rights-integrity.test.mjs services/core-api/test/live-publisher-markets.test.mjs
