name: Flutter Cloud Pilot
# DEV pilot: GOV.UK headlines and Chile evidence preview, pinned formatted final validation; no persistence.

on:
  push:
    branches:
      - codex/cloud-flutter-pilot-20261018
    paths:
      - 'app/**'
      - '.github/workflows/flutter-cloud-pilot.yml'
      - 'docs/operations/flutter-cloud-pilot-transfer-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-cloud-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Flutter 3.38.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Verify Flutter toolchain
        run: flutter --version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run isolated Flutter unit and widget suites
        shell: bash
        run: |
          set -euo pipefail
          for test_dir in test/app test/consumer test/design_system test/live test/private_beta; do
            flutter test --no-pub --test-randomize-ordering-seed=0 --concurrency=1 "$test_dir"
          done
      - name: Verify design invariants
        run: dart run tool/check_design_invariants.dart

  android-cloud-debug-apk:
    needs: flutter-quality
    if: ${{ vars.DIALEKTIK_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      DIALEKTIK_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DIALEKTIK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Flutter 3.38.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Validate public Supabase key format
        shell: bash
        run: |
          case "$DIALEKTIK_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo '::error::Set the Supabase publishable key as the repository Actions variable DIALEKTIK_SUPABASE_PUBLISHABLE_KEY. Only an sb_publishable_ key is accepted.'; exit 1 ;;
          esac
      - name: Build cloud-connected debug APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub \
            --dart-define=DIALEKTIK_ENVIRONMENT=production \
            --dart-define=DIALEKTIK_API_BASE_URL=https://dialektik-core-dev.onrender.com \
            --dart-define=DIALEKTIK_SUPABASE_URL=https://vclsswwfhljczxgnsciq.supabase.co \
            --dart-define="DIALEKTIK_SUPABASE_PUBLISHABLE_KEY=$DIALEKTIK_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=DIALEKTIK_NEWS_READER_ENABLED=true \
            --dart-define=DIALEKTIK_GOVUK_PREVIEW_ENABLED=true \
            --dart-define=DIALEKTIK_CHILE_EVENT_PREVIEW_ENABLED=true \
            --dart-define=DIALEKTIK_SEMANTIC_MODE=disabled \
            --dart-define=DIALEKTIK_OWNERSHIP_MODE=corporate
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee "$RUNNER_TEMP/dialektik-apk.sha256"
          printf 'Android APK: debug, HTTPS Core, private-beta auth gate, semantic mode disabled.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'SHA-256: `%s`\n' "$(cut -d ' ' -f 1 "$RUNNER_TEMP/dialektik-apk.sha256")" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dialektik-cloud-dev-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-build-config-required:
    needs: flutter-quality
    if: ${{ vars.DIALEKTIK_SUPABASE_PUBLISHABLE_KEY == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Report missing public build configuration
        run: |
          echo '::error::Flutter checks can run, but the cloud APK is withheld until the repo variable DIALEKTIK_SUPABASE_PUBLISHABLE_KEY is configured with the project publishable key.'
          exit 1
