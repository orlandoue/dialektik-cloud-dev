name: Core Chile RSS live original links
on:
  push:
    branches: [codex/chile-rss-live-links-20261026]
  pull_request:
    paths:
      - 'services/core-api/**'
      - '.github/workflows/chile-rss-original-links-ci.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test services/core-api/test/chile-rss-link-preview.test.mjs
  real-publisher-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Diagnose RSS structure without logging headlines or copying articles
        run: |
          node --input-type=module <<'NODE'
          import { XMLParser } from 'fast-xml-parser';
          const url='https://www.cooperativa.cl/noticias/site/tax/port/all/rss____1.xml';
          const res=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(12000)});
          if(res.status!==200)throw Error('RSS_HTTP_'+res.status);
          const xml=await res.text();
          if(xml.length>1000000)throw Error('RSS_OVERSIZED');
          const root=new XMLParser({ignoreAttributes:true,parseTagValue:false}).parse(xml);
          const channel=root.rss?.channel;
          const entries=Array.isArray(channel?.item)?channel.item:channel?.item?[channel.item]:[];
          console.log('ROOT_KEYS='+Object.keys(root).slice(0,5).join(','));
          console.log('CHANNEL_TITLE_MATCH='+/Cooperativa/i.test(String(channel?.title??'')));
          console.log('ITEM_COUNT='+entries.length);
          console.log('FIELD_KEYS='+Object.keys(entries[0]??{}).slice(0,15).join(','));
          for(const row of entries.slice(0,3)){
            let host;
            try {host=new URL(row.link).host;} catch {host='invalid';}
            console.log('ORIGIN_HOST='+host+' PUBLISHED_AT='+String(row.pubDate??row.date??'<absent>').slice(0,48));
          }
          NODE
      - name: Fetch one public original RSS feed safely without any SQL writes
        run: |
          node --input-type=module <<'NODE'
          import {fetchChileRssLinkPreview} from './services/core-api/dist/live/chile-rss-link-preview.js';
          const result=await fetchChileRssLinkPreview();
          if(result.items.length<1 || result.items.length>18 ||
             result.persisted||result.content_republication_authorized||
             result.semantic_events_published||result.contradictions_generated)
             throw Error('RSS_REAL_SOURCE_FAIL_CLOSED');
          for(const item of result.items){
            if(!item.canonical_url.startsWith('https://www.cooperativa.cl/noticias/') ||
               !item.headline || !item.published_at || Object.hasOwn(item,'body'))
               throw Error('RSS_LINK_ORIGIN_INVALID');
          }
          console.log('REAL_PUBLISHER='+result.publisher);
          console.log('RECENT_VALID_LINK_COUNT='+result.items.length);
          console.log('MOST_RECENT='+result.items[0].published_at);
          console.log('SOURCE_URL='+result.source_feed_url);
          console.log('ARTICLE_BODIES_DOWNLOADED=0');
          console.log('SQL_WRITES=0');
          NODE
