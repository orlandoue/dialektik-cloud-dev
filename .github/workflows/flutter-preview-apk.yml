name: Dialektik Android side-by-side preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - codex/flutter-beta-android-20261025
    paths:
      - app/**
      - .github/workflows/flutter-preview-apk.yml

permissions:
  contents: read

jobs:
  preview-apk:
    if: ${{ vars.DIALEKTIK_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      DIALEKTIK_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DIALEKTIK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Give the test app its own identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          contents = gradle.read_text()
          original = 'applicationId = "com.dialektik.dialektik"'
          replacement = 'applicationId = "com.dialektik.dialektik.preview"'
          assert contents.count(original) == 1
          gradle.write_text(contents.replace(original, replacement, 1))
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          contents = manifest.read_text()
          original = 'android:label="dialektik"'
          assert contents.count(original) == 1
          manifest.write_text(contents.replace(original, 'android:label="Dialektik Prueba"', 1))
          PY
      - name: Build the private-beta preview
        shell: bash
        run: |
          set -euo pipefail
          case "$DIALEKTIK_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac
          flutter build apk --debug --no-pub \
            --dart-define=DIALEKTIK_ENVIRONMENT=production \
            --dart-define=DIALEKTIK_API_BASE_URL=https://dialektik-core-dev.onrender.com \
            --dart-define=DIALEKTIK_SUPABASE_URL=https://vclsswwfhljczxgnsciq.supabase.co \
            --dart-define="DIALEKTIK_SUPABASE_PUBLISHABLE_KEY=$DIALEKTIK_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=DIALEKTIK_NEWS_READER_ENABLED=true \
            --dart-define=DIALEKTIK_GOVUK_PREVIEW_ENABLED=true \
            --dart-define=DIALEKTIK_GOVUK_HOUSING_PREVIEW_ENABLED=true \
            --dart-define=DIALEKTIK_CHILE_EVENT_PREVIEW_ENABLED=true \
            --dart-define=DIALEKTIK_SEMANTIC_MODE=disabled \
            --dart-define=DIALEKTIK_OWNERSHIP_MODE=corporate
          cp build/app/outputs/flutter-apk/app-debug.apk build/dialektik-prueba.apk
          sha256sum build/dialektik-prueba.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Dialektik-Prueba-Android
          path: app/build/dialektik-prueba.apk
          retention-days: 14
          if-no-files-found: error
