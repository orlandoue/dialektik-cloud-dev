name: Core dual-role candidate switch (config only; no Render deploy)
on:
  push:
    branches: [codex/core-db-dual-role-cutover-guard-20261021]
permissions:
  contents: read
jobs:
  fail-closed-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install and compile exact existing Core/DB
        run: |
          npm install --global npm@11.6.2
          npm ci --no-audit --no-fund
          npm run build
      - name: Exercise candidate-only role cutover and refusal tests
        run: |
          npx vitest run services/core-api/test/core-db-dual-role-cutover.test.ts --config services/core-api/vitest.config.mts
          echo 'RENDER_ENVIRONMENT_CHANGED=FALSE'
          echo 'REMOTE_DATABASE_ROLES_CHANGED=FALSE'
