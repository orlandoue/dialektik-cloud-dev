name: Dialektik full empty Auth and reconstructed ledger target (synthetic only)
on:
  push:
    branches: [codex/restore-gate-managed-recovery-20261020]
    paths:
      - '.github/workflows/supabase-local-ledger-target-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-supabase-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Install exact Supabase CLI version and discover start options
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.120.0 --version
          npx --yes supabase@2.120.0 start --help >/dev/null
          npx --yes supabase@2.120.0 init --help >/dev/null
          echo 'PINNED_SUPABASE_CLI_DISCOVERY=PASS'
      - name: Bootstrap local Supabase with synthetic empty Auth, NOT connected to managed DEV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dialektik-local-bootstrap"
          cd "$RUNNER_TEMP/dialektik-local-bootstrap"
          npx --yes supabase@2.120.0 init > "$RUNNER_TEMP/local-init.log" 2>&1
          npx --yes supabase@2.120.0 start > "$RUNNER_TEMP/local-start.log" 2>&1 || {
            echo 'LOCAL_SUPABASE_STACK_START=FAIL_REDACTED'
            exit 1
          }
          echo 'LOCAL_SUPABASE_STACK_START=PASS'
          db="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2 ~ /^supabase_db_/ {print $1}' | head -1)"
          if [ -z "$db" ]; then
            echo 'LOCAL_DATABASE_CONTAINER_MISSING'
            exit 1
          fi
          # Only in this disposable LOCAL instance; never connected to remote DEV.
          # The six ledger columns/types come from read-only remote catalog inventory.
          docker exec "$db" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE SCHEMA IF NOT EXISTS supabase_migrations; CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
              version text PRIMARY KEY,
              statements text[],
              name text,
              created_by text,
              idempotency_key text,
              rollback text[]
            );" > "$RUNNER_TEMP/local-ledger-init.log" 2>&1 || {
              echo 'DISPOSABLE_LEDGER_STRUCTURE_BOOTSTRAP=FAIL'
              exit 1
            }
          echo 'DISPOSABLE_LEDGER_STRUCTURE_BOOTSTRAP=PASS'
          result="$(docker exec "$db" psql -XAt -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT (to_regclass('auth.users') IS NOT NULL)::integer, (to_regclass('auth.identities') IS NOT NULL)::integer, (to_regclass('auth.sessions') IS NOT NULL)::integer, (to_regclass('auth.refresh_tokens') IS NOT NULL)::integer, (to_regclass('supabase_migrations.schema_migrations') IS NOT NULL)::integer;")"
          echo "LOCAL_BOOTSTRAPPED_AUTH_AND_LEDGER_TABLES_PRESENT=$result"
          test "$result" = '1|1|1|1|1'
          echo 'EMPTY_LOCAL_SUPABASE_MANAGED_SCHEMA=PASS'
          echo 'RESTORE_OF_REAL_BACKUP=NOT_ATTEMPTED'
          echo 'USER_BACKUP_DECRYPTED=FALSE'
          echo 'REMOTE_DEV_DATABASE_CONTACTED=FALSE'
      - name: Destroy synthetic Supabase project containers and volumes
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/dialektik-local-bootstrap" 2>/dev/null || exit 0
          npx --yes supabase@2.120.0 stop --no-backup > "$RUNNER_TEMP/local-stop.log" 2>&1 || true
          echo 'LOCAL_STACK_CLEANUP_ATTEMPTED=TRUE'
          echo 'REMOTE_SUPABASE_WRITES=0'
