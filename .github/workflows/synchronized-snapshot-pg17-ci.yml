name: PostgreSQL 17 synchronized snapshot proof (synthetic)
on:
  push:
    branches: [codex/atomic-snapshot-synchronized-pg17-20261021]
permissions:
  contents: read
jobs:
  synced-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse and reject remote credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/operations/synchronized_snapshot_proof.py
          echo 'NO_REMOTE_DATABASE=TRUE'
      - name: Run three concurrent-version archives against one exported transaction
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker run -d --rm --network none --name dialektik-snapshot-atomicity \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17.11 >/dev/null
          trap 'docker rm -f dialektik-snapshot-atomicity >/dev/null 2>&1 || true' EXIT
          for n in $(seq 1 50); do
            docker exec dialektik-snapshot-atomicity pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec dialektik-snapshot-atomicity pg_isready -U postgres >/dev/null
          docker exec dialektik-snapshot-atomicity psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth; CREATE SCHEMA supabase_migrations; \
               CREATE TABLE public.example_articles(id text PRIMARY KEY); \
               CREATE TABLE auth.example_users(id text PRIMARY KEY); \
               CREATE TABLE supabase_migrations.example_versions(id text PRIMARY KEY); \
               INSERT INTO public.example_articles VALUES ('before-snapshot'); \
               INSERT INTO auth.example_users VALUES ('before-snapshot'); \
               INSERT INTO supabase_migrations.example_versions VALUES ('before-snapshot');" >/dev/null
          docker exec dialektik-snapshot-atomicity createdb -U postgres snapshot_target
          docker exec dialektik-snapshot-atomicity psql -X -U postgres -d snapshot_target \
            -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth; CREATE SCHEMA supabase_migrations; \
               CREATE TABLE public.example_articles(id text PRIMARY KEY); \
               CREATE TABLE auth.example_users(id text PRIMARY KEY); \
               CREATE TABLE supabase_migrations.example_versions(id text PRIMARY KEY);" >/dev/null
          python3 scripts/operations/synchronized_snapshot_proof.py
