name: Synchronized archive native restore negative/synthetic gate
on:
  push:
    branches: [codex/synced-archive-isolated-replay-20261021]
permissions:
  contents: read
jobs:
  pg17-synthetic-custom-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Static safety and Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/operations/replay_synchronized_data_offline.sh
          python3 -m py_compile scripts/operations/verify_synchronized_archive.py
          grep -Fq "TARGET_CONTAINER_HAS_NETWORK_FAIL_CLOSED" scripts/operations/real_supabase_offline_replay.sh
          grep -Fq "EXECUTE_SYNC_DEV_BACKUP_OFFLINE_RESTORE_20261021" .github/workflows/real-synced-backup-isolated-restore.yml
          grep -Fq "environment: dialektik-dev-backup" .github/workflows/real-synced-backup-isolated-restore.yml
          echo 'NO_REAL_BACKUP_OR_DEV_ACCESS=TRUE'
      - name: Native Supabase local PG17 custom archive and RLS roundtrip
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          w="$RUNNER_TEMP/synthetic-synced-restore"
          mkdir -p "$w/local" "$w/private"
          cd "$w/local"
          trap 'npx --yes supabase@2.120.0 stop --no-backup >/dev/null 2>&1 || true; rm -rf -- "$w"' EXIT
          npx --yes supabase@2.120.0 init > "$w/private/init.log" 2>&1
          if ! npx --yes supabase@2.120.0 db start > "$w/private/db-start.log" 2>&1; then
            echo 'SYNTHETIC_SUPABASE_DB_START=FAIL_REDACTED'
            exit 1
          fi
          db="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          test -n "$db"
          docker exec "$db" psql -XAt -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT CASE WHEN to_regclass('auth.users') IS NOT NULL AND
               to_regnamespace('public') IS NOT NULL THEN 'PASS' ELSE 'FAIL' END;" \
            > "$w/private/db-ready.log" 2>&1 || exit 1
          [ "$(cat "$w/private/db-ready.log")" = PASS ] || exit 1
          echo 'SYNTHETIC_SUPABASE_DB_READY=PASS'
          docker exec "$db" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE public.example_archive_article(id text PRIMARY KEY);
                ALTER TABLE public.example_archive_article ENABLE ROW LEVEL SECURITY;
                INSERT INTO public.example_archive_article VALUES ('synthetic-only');" \
            > "$w/private/fixture.log" 2>&1 || {
              echo 'SYNTHETIC_PUBLIC_FIXTURE=FAIL_REDACTED'; exit 1;
            }
          docker exec "$db" pg_dump -U postgres -d postgres \
            --format=custom --no-owner --no-privileges --schema=public \
            --file=/tmp/dialektik-native-public.dump > "$w/private/dump.log" 2>&1 || {
              echo 'SYNTHETIC_NATIVE_PUBLIC_DUMP=FAIL_REDACTED'; exit 1;
            }
          echo 'SYNTHETIC_NATIVE_PUBLIC_DUMP=PASS'
          docker exec "$db" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP TABLE public.example_archive_article;" \
            > "$w/private/drop.log" 2>&1 || exit 1
          docker exec "$db" pg_restore --list /tmp/dialektik-native-public.dump > "$w/private/public.toc"
          python3 "$GITHUB_WORKSPACE/scripts/operations/filter_seeded_public_schema_toc.py" \
            --input "$w/private/public.toc" --output "$w/private/public-only-dedup.toc"
          docker cp "$w/private/public-only-dedup.toc" "$db:/tmp/dialektik-native-public-dedup.toc"
          docker exec "$db" pg_restore -U postgres -d postgres \
            --schema-only --no-owner --no-privileges --single-transaction --exit-on-error \
            --use-list /tmp/dialektik-native-public-dedup.toc \
            /tmp/dialektik-native-public.dump > "$w/private/schema.log" 2>&1 || {
              echo 'SYNTHETIC_PUBLIC_SCHEMA_RESTORE=FAIL_REDACTED'; exit 1;
            }
          echo 'SYNTHETIC_PUBLIC_SCHEMA_RESTORE=PASS'
          docker exec "$db" pg_restore -U postgres -d postgres \
            --data-only --no-owner --no-privileges --single-transaction --exit-on-error \
            /tmp/dialektik-native-public.dump > "$w/private/data.log" 2>&1 || {
              echo 'SYNTHETIC_PUBLIC_DATA_RESTORE=FAIL_REDACTED'; exit 1;
            }
          echo 'SYNTHETIC_PUBLIC_DATA_RESTORE=PASS'
          result="$(docker exec "$db" psql -XAt -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c "SELECT count(*) || '|' ||
               (SELECT relrowsecurity FROM pg_class WHERE oid=
                'public.example_archive_article'::regclass)
               FROM public.example_archive_article;" 2>/dev/null)" || exit 1
          [ "$result" = '1|t' ] || {
            echo 'SYNTHETIC_RESTORED_RLS_OR_ROWS=FAIL'; exit 1;
          }
          echo 'SYNTHETIC_PUBLIC_CUSTOM_SCHEMA_AND_DATA_REPLAY=PASS'
          echo 'SYNTHETIC_PUBLIC_RLS_PRESERVATION=PASS'
          echo 'SYNTHETIC_REAL_BACKUP_OPENED=FALSE'
